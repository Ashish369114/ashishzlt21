name: Debug DB

on:
  push:
    branches: [dev]
    paths:
      - 'debug.txt'

permissions:
  id-token: write
  contents: write

jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::648592435113:role/ZLT_SOS_Git_Admin
          aws-region: ap-south-1

      - name: Get secrets and query
        run: |
          SECRET=$(aws secretsmanager get-secret-value --secret-id zltsos/dev --query SecretString --output text)
          BACKEND_URL=$(echo $SECRET | jq -r '.BACKEND_URL')
          curl -s "$BACKEND_URL/api/debug-users" > debug-output.json
          
      - name: Commit and push result
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "github-actions@github.com"
          git add debug-output.json
          git commit -m "chore: save debug output" || echo "No changes"
          git push
