name: Deploy Backend to EC2

on:
  push:
    branches: [dev, test, main]
    paths:
      - 'backend/**'
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set environment
        id: env
        run: |
          if [[ "${{ github.ref_name }}" == "dev" ]]; then
            echo "ENV=dev" >> $GITHUB_OUTPUT
            echo "SECRET_NAME=zltsos/dev" >> $GITHUB_OUTPUT
            echo "APP_NAME=zltsos-backend-dev" >> $GITHUB_OUTPUT
            echo "APP_DIR=/home/ec2-user/app-dev" >> $GITHUB_OUTPUT
            echo "NODE_ENV=development" >> $GITHUB_OUTPUT
            echo "PORT=5000" >> $GITHUB_OUTPUT
          elif [[ "${{ github.ref_name }}" == "test" ]]; then
            echo "ENV=test" >> $GITHUB_OUTPUT
            echo "SECRET_NAME=zltsos/test" >> $GITHUB_OUTPUT
            echo "APP_NAME=zltsos-backend-test" >> $GITHUB_OUTPUT
            echo "APP_DIR=/home/ec2-user/app-test" >> $GITHUB_OUTPUT
            echo "NODE_ENV=test" >> $GITHUB_OUTPUT
            echo "PORT=5001" >> $GITHUB_OUTPUT
          else
            echo "ENV=prod" >> $GITHUB_OUTPUT
            echo "SECRET_NAME=zltsos/prod" >> $GITHUB_OUTPUT
            echo "APP_NAME=zltsos-backend-prod" >> $GITHUB_OUTPUT
            echo "APP_DIR=/home/ec2-user/app" >> $GITHUB_OUTPUT
            echo "NODE_ENV=production" >> $GITHUB_OUTPUT
            echo "PORT=5000" >> $GITHUB_OUTPUT
          fi

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        continue-on-error: true
        with:
          role-to-assume: arn:aws:iam::648592435113:role/ZLT_SOS_Git_Admin
          aws-region: ap-south-1

      - name: Get secrets from AWS Secrets Manager
        id: secrets
        continue-on-error: true
        run: |
          SECRET=$(aws secretsmanager get-secret-value --secret-id ${{ steps.env.outputs.SECRET_NAME }} --query SecretString --output text || echo "{}")
          echo "DB_HOST=$(echo $SECRET | jq -r '.DB_HOST // empty')" >> $GITHUB_OUTPUT
          echo "DB_PORT=$(echo $SECRET | jq -r '.DB_PORT // empty')" >> $GITHUB_OUTPUT
          echo "DB_NAME=$(echo $SECRET | jq -r '.DB_NAME // empty')" >> $GITHUB_OUTPUT
          echo "DB_USER=$(echo $SECRET | jq -r '.DB_USER // empty')" >> $GITHUB_OUTPUT
          echo "DB_PASSWORD=$(echo $SECRET | jq -r '.DB_PASSWORD // empty')" >> $GITHUB_OUTPUT
          echo "JWT_SECRET=$(echo $SECRET | jq -r '.JWT_SECRET // empty')" >> $GITHUB_OUTPUT
          echo "JWT_REFRESH_SECRET=$(echo $SECRET | jq -r '.JWT_REFRESH_SECRET // empty')" >> $GITHUB_OUTPUT
          echo "FRONTEND_URL=$(echo $SECRET | jq -r '.FRONTEND_URL // empty')" >> $GITHUB_OUTPUT
          echo "EC2_HOST=$(echo $SECRET | jq -r '.EC2_HOST // empty')" >> $GITHUB_OUTPUT
          SSH_KEY=$(aws secretsmanager get-secret-value --secret-id zltsos/ec2-ssh-key --query SecretString --output text || echo "")
          if [ -n "$SSH_KEY" ]; then
            echo "$SSH_KEY" > /tmp/ssh_key.pem
            chmod 400 /tmp/ssh_key.pem
          fi

      - name: Deploy to EC2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO_NAME: ${{ github.repository }}
          BRANCH_NAME: ${{ github.ref_name }}
          APP_DIR: ${{ steps.env.outputs.APP_DIR }}
          APP_NAME: ${{ steps.env.outputs.APP_NAME }}
          PORT: ${{ steps.env.outputs.PORT }}
          NODE_ENV: ${{ steps.env.outputs.NODE_ENV }}
          EC2_HOST: ${{ steps.secrets.outputs.EC2_HOST }}
          DB_HOST: ${{ steps.secrets.outputs.DB_HOST }}
          DB_PORT: ${{ steps.secrets.outputs.DB_PORT }}
          DB_NAME: ${{ steps.secrets.outputs.DB_NAME }}
          DB_USER: ${{ steps.secrets.outputs.DB_USER }}
          DB_PASSWORD: ${{ steps.secrets.outputs.DB_PASSWORD }}
          JWT_SECRET: ${{ steps.secrets.outputs.JWT_SECRET }}
          JWT_REFRESH_SECRET: ${{ steps.secrets.outputs.JWT_REFRESH_SECRET }}
          FRONTEND_URL: ${{ steps.secrets.outputs.FRONTEND_URL }}
        run: |
          if [ ! -f /tmp/ssh_key.pem ] || [ -z "$EC2_HOST" ]; then
            echo "Skipping EC2 SSH deployment: missing SSH key or EC2_HOST host secret."
            exit 0
          fi

          ssh -o StrictHostKeyChecking=no -i /tmp/ssh_key.pem ec2-user@$EC2_HOST \
            "export GITHUB_TOKEN='${GITHUB_TOKEN}'; \
             export REPO_NAME='${REPO_NAME}'; \
             export BRANCH_NAME='${BRANCH_NAME}'; \
             export APP_DIR='${APP_DIR}'; \
             export APP_NAME='${APP_NAME}'; \
             export PORT='${PORT}'; \
             export NODE_ENV='${NODE_ENV}'; \
             export DB_HOST='${DB_HOST}'; \
             export DB_PORT='${DB_PORT}'; \
             export DB_NAME='${DB_NAME}'; \
             export DB_USER='${DB_USER}'; \
             export DB_PASSWORD='${DB_PASSWORD}'; \
             export JWT_SECRET='${JWT_SECRET}'; \
             export JWT_REFRESH_SECRET='${JWT_REFRESH_SECRET}'; \
             export FRONTEND_URL='${FRONTEND_URL}'; \
             bash -s" << 'EOF'
            set -e
            export NVM_DIR="$HOME/.nvm"
            [ -s "$NVM_DIR/nvm.sh" ] && \. "$NVM_DIR/nvm.sh"
            export PATH=$PATH:$NVM_DIR/versions/node/$(ls $NVM_DIR/versions/node 2>/dev/null | tail -n 1)/bin

            mkdir -p "$APP_DIR"
            cd "$APP_DIR"

            REPO_URL="https://x-access-token:${GITHUB_TOKEN}@github.com/${REPO_NAME}.git"

            if [ -d ".git" ]; then
              git remote set-url origin "$REPO_URL" || true
              git fetch origin "$BRANCH_NAME" || git fetch --all
              git checkout -f "$BRANCH_NAME" || git checkout -b "$BRANCH_NAME" origin/"$BRANCH_NAME"
              git reset --hard origin/"$BRANCH_NAME"
            else
              git clone -b "$BRANCH_NAME" "$REPO_URL" .
            fi

            cd backend
            npm install --omit=dev

            cat > .env << ENVEOF
          PORT=${PORT}
          DB_HOST=${DB_HOST}
          DB_PORT=${DB_PORT}
          DB_NAME=${DB_NAME}
          DB_USER=${DB_USER}
          DB_PASSWORD=${DB_PASSWORD}
          JWT_SECRET=${JWT_SECRET}
          JWT_REFRESH_SECRET=${JWT_REFRESH_SECRET}
          FRONTEND_URL=${FRONTEND_URL}
          NODE_ENV=${NODE_ENV}
          ENVEOF

            npm install --omit=dev pg
            DB_HOST="${DB_HOST}" \
            DB_USER="${DB_USER}" \
            DB_PASSWORD="${DB_PASSWORD}" \
            DB_NAME="${DB_NAME}" \
            DB_PORT="${DB_PORT}" \
            node create_db.js || true

            node seeds/seedAllModules.js || true

            pm2 delete "${APP_NAME}" 2>/dev/null || true
            pm2 start server.js --name "${APP_NAME}"
            pm2 save
          EOF

      - name: Cleanup
        if: always()
        run: rm -f /tmp/ssh_key.pem
